<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Search for any League of Legends champion by name."
    />
    <title>Search Champions | League of Legends</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../homepage/assets/img/JL%20Logo.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Style -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/search.css" />
  </head>
  <body>
    <div class="container-fluid px-0">
      <!-- Navigation -->
      <div class="row g-0">
        <div class="col-12">
          <nav
            id="navbar"
            class="navbar navbar-expand-lg navbar-dark fixed-top"
          >
            <div class="container">
              <a class="navbar-brand" href="index.html">League of Legends</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-lg-2 align-items-lg-center">
                  <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="champions.html">Champions</a>
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link active"
                      href="search.html"
                      aria-current="page"
                      >Search</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link"
                      href="https://www.leagueoflegends.com/en-us/"
                      target="_blank"
                      rel="noopener"
                      >Official Website</a
                    >
                  </li>
                  <li class="nav-item ms-lg-2">
                    <a
                      class="btn btn-gold btn-sm fw-bold px-3"
                      href="https://signup.na.leagueoflegends.com/en/signup/redownload"
                      target="_blank"
                      rel="noopener"
                      >Play for Free</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>

      <!-- Hero -->
      <div class="row g-0">
        <nav class="col-12 page-hero position-relative">
          <div class="container">
            <div class="row">
              <div class="col-12 col-lg-8 mx-auto text-center">
                <h1 class="hero-title">Search Champions</h1>
                <p class="hero-lead">
                  Type a champion's name to see their role and open their
                  profile.
                </p>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <!-- Content -->
      <div class="row g-0">
        <div class="col-12 section">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-12 col-md-10 col-lg-6">
                <label class="visually-hidden" for="searchTerm"
                  >Champion name</label
                >
                <div class="search-group d-flex justify-content-center">
                  <input
                    type="text"
                    class="form-control search-input"
                    id="searchTerm"
                    placeholder="Search for a champion, e.g. Ahri"
                    autocomplete="off"
                  />
                  <button
                    type="button"
                    class="btn search-button"
                    id="searchButton"
                  >
                    Search
                  </button>
                </div>
              </div>
            </div>

            <div class="row g-4 mt-3" id="resultContainer"></div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="row g-0 mt-auto">
        <footer class="col-12 site-footer">
          <div class="container">
            <p class="footer-bottom mb-0">
              &copy; <span id="footerYear">2026</span> Fan project built with
              the Riot Games Data Dragon API. Not affiliated with Riot Games,
              Inc.
            </p>
          </div>
        </footer>
      </div>
    </div>

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/search.js"></script>
    <script>
      document.getElementById("footerYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
