<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found | Jalem Louise Grapani</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="assets/img/J2.1.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Content */

      .error-code {
        font-family: var(--font-heading);
        font-size: clamp(5.5rem, 3rem + 14vw, 11rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid min-vh-100 d-flex flex-column">
      <!-- Content -->
      <div
        class="row justify-content-center align-items-center flex-grow-1 text-center"
      >
        <main class="col-12 col-md-8 col-lg-6 px-4">
          <div class="section-label font-monospace text-accent mb-3">
            error / 404
          </div>
          <div class="error-code text-accent fw-bold mb-2" aria-hidden="true">
            404
          </div>
          <h1 class="main-title lh-1 mb-3">Page not found</h1>
          <p class="main-description text-body-secondary mb-0">
            The page you're looking for does not exist. It may have been removed
            or renamed, or it may be temporarily unavailable.
          </p>
          <a href="index.html" class="small-action my-4">Back to home</a>
          <div class="information-box small text-body-secondary p-3">
            <i class="bi bi-info-circle text-accent me-2"></i>
            You can return to the homepage and continue exploring my portfolio.
          </div>
        </main>
      </div>

      <!-- Footer -->
      <div class="row">
        <footer class="col-12 site-footer text-center pb-5">
          © <span id="currentYear">2026</span> Jalem Louise Grapani · Calamba
          City, PH
        </footer>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Theme
      let theme = "dark";

      try {
        theme = localStorage.getItem("portfolio-theme") || theme;
      } catch (error) {
        console.error(error.message);
      }

      document.documentElement.setAttribute("data-theme", theme);

      // Footer
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
