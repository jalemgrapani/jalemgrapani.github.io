<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Jalem Louise Grapani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/img/J2.1.svg" />
    <base href="/" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Navigation */

      .site-sidebar {
        grid-template-columns: 1fr auto 1fr;
      }

      .sidebar-logo {
        justify-self: start;
      }

      .sidebar-bottom {
        justify-self: end;
      }

      .theme-button {
        color: var(--text);
      }

      /* Content */

      .error-page {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .error-main {
        padding-top: 90px;
      }

      .error-main .site-container {
        width: 100%;
        text-align: center;
      }

      .error-main .main-buttons {
        justify-content: center;
      }

      .error-code {
        margin-bottom: 8px;
        color: var(--accent);
        font-family: var(--font-heading);
        font-size: clamp(5.5rem, 3rem + 14vw, 11rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .error-heading {
        margin-bottom: 14px;
        font-size: var(--fs-hero);
        line-height: 1.1;
      }

      .error-description {
        max-width: 560px;
        margin: 0 auto;
        color: var(--muted);
        font-size: var(--fs-lg);
      }

      .error-main .information-box {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
        color: var(--muted);
        font-size: var(--fs-sm);
      }

      .error-main .information-box i {
        margin-right: 6px;
        color: var(--accent);
      }

      .action-btn-primary {
        --bs-btn-color: var(--bg);
        --bs-btn-bg: var(--accent);
        --bs-btn-border-color: var(--accent);
        --bs-btn-hover-color: var(--accent);
        --bs-btn-hover-bg: var(--accent-soft);
        --bs-btn-hover-border-color: var(--accent);
        --bs-btn-active-color: var(--accent);
        --bs-btn-active-bg: var(--accent-soft);
        --bs-btn-active-border-color: var(--accent);
      }

      /* Responsive */

      @media (max-width: 575.98px) {
        .error-main {
          padding-top: 0;
        }

        .site-footer {
          padding-bottom: 110px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container-fluid error-page d-flex flex-column">
      <!-- Navigation -->
      <div
        class="site-sidebar position-fixed start-50 translate-middle-x z-3 d-grid align-items-center border rounded-pill shadow"
      >
        <a
          href="index.html"
          class="sidebar-logo d-flex align-items-center"
          aria-label="Back to homepage"
        >
          <img
            class="d-block"
            src="assets/img/J2.svg"
            alt="Jalem Louise Grapani logo"
            height="40"
          />
        </a>

        <nav
          class="site-navigation d-flex align-items-center"
          aria-label="Main navigation"
        >
          <a
            href="index.html"
            class="d-flex align-items-center text-decoration-none"
            aria-label="Home"
            ><i class="bi bi-house-door"></i
            ><span class="d-none d-sm-inline">Home</span></a
          >
          <a
            href="index.html#contact"
            class="d-flex align-items-center text-decoration-none"
            aria-label="Contact"
            ><i class="bi bi-envelope"></i
            ><span class="d-none d-sm-inline">Contact</span></a
          >
        </nav>

        <div class="sidebar-bottom d-flex align-items-center">
          <button
            type="button"
            class="theme-button d-flex align-items-center justify-content-center p-0 border rounded-circle bg-transparent"
            id="themeButton"
            aria-label="Switch to dark mode"
          >
            <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div class="site-main error-main row align-items-center flex-grow-1">
        <div class="col-12 site-container mx-auto px-4">
          <div class="section-label font-monospace mb-3">error / 404</div>
          <div class="error-code" aria-hidden="true">404</div>
          <h1 class="error-heading">Page not found</h1>
          <p class="error-description">
            The page you're looking for does not exist. It may have been removed
            or renamed, or it may be temporarily unavailable.
          </p>

          <div class="main-buttons d-flex flex-wrap gap-3 my-4">
            <a
              href="index.html"
              class="action-btn action-btn-primary btn px-4 rounded-pill"
              >Back to home</a
            >
          </div>

          <div class="information-box p-3 mb-4">
            <i class="bi bi-info-circle"></i>
            You can return to the homepage and continue exploring my portfolio.
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="site-footer text-center">
        © <span id="year">2026</span> Jalem Louise Grapani · Calamba City, PH
      </footer>
    </div>

    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("portfolio-theme") === "dark" ? "dark" : "light",
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>

    <!-- Script -->
    <script>
      var html = document.documentElement;
      var themeButton = document.getElementById("themeButton");
      var themeIcon = document.getElementById("themeIcon");
      var year = document.getElementById("year");

      function updateThemeButton() {
        var isDark = html.getAttribute("data-theme") === "dark";
        themeIcon.className = isDark
          ? "bi bi-sun-fill"
          : "bi bi-moon-stars-fill";
        themeButton.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode",
        );
      }

      function toggleTheme() {
        var next =
          html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        try {
          localStorage.setItem("portfolio-theme", next);
        } catch (e) {}
        updateThemeButton();
      }

      themeButton.addEventListener("click", toggleTheme);

      updateThemeButton();
      year.textContent = new Date().getFullYear();
    </script>
  </body>
</html>
