<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Jalem Louise Grapani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/img/J2.1.svg" />
    <base href="/" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Content */

      .error-page {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .error-code {
        margin-bottom: 8px;
        color: var(--accent);
        font-family: var(--font-heading);
        font-size: clamp(5.5rem, 3rem + 14vw, 11rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .error-heading {
        margin-bottom: 14px;
        font-size: var(--fs-hero);
        line-height: 1.1;
      }

      .error-description,
      .information-box {
        max-width: 560px;
      }

      .error-description {
        font-size: var(--fs-lg);
      }

      .information-box {
        font-size: var(--fs-sm);
      }

      .information-box i {
        margin-right: 6px;
      }

      /* Components */

      .action-btn-primary {
        --bs-btn-color: var(--bg);
        --bs-btn-bg: var(--accent);
        --bs-btn-border-color: var(--accent);
        --bs-btn-hover-color: var(--accent);
        --bs-btn-hover-bg: var(--accent-soft);
        --bs-btn-hover-border-color: var(--accent);
        --bs-btn-active-color: var(--accent);
        --bs-btn-active-bg: var(--accent-soft);
        --bs-btn-active-border-color: var(--accent);
      }

      /* Responsive */

      @media (max-width: 575.98px) {
        .site-footer {
          padding-bottom: 40px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container-fluid error-page d-flex flex-column">
      <!-- Content -->
      <div class="row align-items-center flex-grow-1">
        <div class="col-12 site-container mx-auto px-4 text-center">
          <div class="section-label font-monospace text-accent mb-3">
            error / 404
          </div>
          <div class="error-code" aria-hidden="true">404</div>
          <h1 class="error-heading">Page not found</h1>
          <p class="error-description text-body-secondary mx-auto">
            The page you're looking for does not exist. It may have been removed
            or renamed, or it may be temporarily unavailable.
          </p>
          <a
            href="index.html"
            class="action-btn-primary btn px-4 my-4 rounded-pill"
            >Back to home</a
          >
          <div class="information-box text-body-secondary mx-auto p-3 mb-4">
            <i class="bi bi-info-circle text-accent"></i>
            You can return to the homepage and continue exploring my portfolio.
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="row">
        <footer class="col-12 site-footer text-center">
          © <span id="year">2026</span> Jalem Louise Grapani · Calamba City, PH
        </footer>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      // Theme
      try {
        if (localStorage.getItem("portfolio-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}

      // Footer
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
