<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 Error Page - Jalem's Portfolio</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="homepage/assets/img/J2.svg"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

<style>
  /* General */
:root {
    --main-bg: #f2f3f1;
    --main-surface: #ffffff;
    --main-text: #171a1c;
    --main-muted: #5b6167;
    --main-border: #dee1dd;
    --main-accent: #00796b;
    --main-accent-light: #e4efe9;

    --font-heading: "Poppins", sans-serif;
    --font-body: "Roboto", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
}

html[data-theme="dark"] {
    --main-bg: #121513;
    --main-surface: #191d1b;
    --main-text: #e8eae7;
    --main-muted: #98a09b;
    --main-border: #2a2f2c;
    --main-accent: #23dbc8;
    --main-accent-light: #1c2b24;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    margin: 0;
    background: var(--main-bg);
    color: var(--main-text);
    font-family: var(--font-body);
    line-height: 1.6;
    transition:
        background 0.25s ease,
        color 0.25s ease;
}

a {
    color: inherit;
    text-decoration: none;
}

.error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* NAVBAR */

.error-navbar {
    padding: 2px 0;
    border-bottom: 1px solid var(--main-border);
    background: var(--main-bg);
}

.navbar-logo {
    display: flex;
    align-items: center;
}

.navbar-logo img {
    display: block;
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.navbar-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
}

.navbar-nav .nav-item {
    display: flex;
    align-items: center;
}

.navbar-nav .nav-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 8px;
    color: var(--main-muted);
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.navbar-nav .nav-link i {
    display: none;
    font-size: 17px;
    line-height: 1;
}

.navbar-nav .nav-link:hover {
    color: var(--main-text);
    border-bottom-color: var(--main-accent);
}

.theme-button {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--main-border);
    border-radius: 7px;
    background: var(--main-surface);
    color: var(--main-text);
    transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.theme-button:hover {
    border-color: var(--main-accent);
    color: var(--main-accent);
}

.theme-button i {
    font-size: 15px;
    line-height: 1;
}

/* ERROR CONTENT */

.error-content {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 55px 0 45px;
    text-align: center;
}

.error-label {
    margin-bottom: 12px;
    color: var(--main-accent);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
}

.error-title {
    margin: 0;
    color: var(--main-text);
    font-family: var(--font-heading);
    font-size: clamp(6rem, 18vw, 11rem);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.06em;
}

.error-message {
    margin: 25px 0 10px;
    color: var(--main-text);
    font-family: var(--font-heading);
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 600;
}

.error-description {
    max-width: 600px;
    margin: 0 auto;
    color: var(--main-muted);
    font-size: 15px;
    line-height: 1.7;
}

/* HOME BUTTON */

.home-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border: 1px solid var(--main-accent);
    border-radius: 8px;
    background: var(--main-accent);
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.home-button:hover {
    color: #ffffff;
    opacity: 0.88;
    transform: translateY(-1px);
}

/* INFORMATION BOX */

.error-info {
    max-width: 600px;
    margin: 38px auto 0;
    padding: 17px 20px;
    border: 1px solid var(--main-border);
    border-radius: 10px;
    background: var(--main-surface);
    color: var(--main-muted);
    font-size: 13px;
    line-height: 1.6;
}

.error-info i {
    margin-right: 6px;
    color: var(--main-accent);
}

/* FOOTER */

.error-footer {
    padding: 15px 20px;
    border-top: 1px solid var(--main-border);
    color: var(--main-muted);
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: center;
}

/* TABLET */

@media (max-width: 991.98px) {
    .error-navbar {
        padding: 2px 0;
    }

    .navbar-logo img {
        width: 66px;
        height: 66px;
    }

    .error-content {
        padding: 50px 0 40px;
    }
}

/* MOBILE */

@media (max-width: 575.98px) {
    .error-navbar {
        padding: 2px 0;
    }

    .navbar-logo img {
        width: 58px;
        height: 58px;
    }

    .navbar-nav {
        gap: 4px;
    }

    .navbar-nav .nav-link {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 7px;
    }

    .navbar-nav .nav-link span {
        display: none;
    }

    .navbar-nav .nav-link i {
        display: block;
        font-size: 17px;
    }

    .navbar-nav .nav-link:hover {
        background: var(--main-accent-light);
        border: 0;
    }

    .theme-button {
        width: 36px;
        height: 36px;
        border: 0;
        background: transparent;
    }

    .theme-button:hover {
        background: var(--main-accent-light);
    }

    .theme-button i {
        font-size: 17px;
    }

    .error-content {
        padding: 40px 0 30px;
    }

    .error-title {
        font-size: clamp(5.5rem, 28vw, 8rem);
    }

    .error-message {
        margin-top: 21px;
        font-size: 1.35rem;
    }

    .error-description {
        font-size: 13px;
    }

    .home-button {
        width: 100%;
        max-width: 180px;
    }

    .error-info {
        margin-top: 30px;
        padding: 15px;
        font-size: 12px;
    }

    .error-footer {
        padding: 14px 10px;
        font-size: 9px;
    }
}

/* VERY SMALL MOBILE */

@media (max-width: 360px) {
    .navbar-logo img {
        width: 52px;
        height: 52px;
    }

    .navbar-nav {
        gap: 2px;
    }

    .navbar-nav .nav-link,
    .theme-button {
        width: 34px;
        height: 34px;
    }

    .navbar-nav .nav-link i,
    .theme-button i {
        font-size: 16px;
    }

    .error-content {
        padding-top: 35px;
    }

    .error-message {
        font-size: 1.2rem;
    }
}
</style>

  <body>
    <div class="error-page">
      <nav class="error-navbar">
        <div class="container">
          <div class="row align-items-center justify-content-between">
            <div class="col-auto">
              <a href="index.html" class="navbar-logo">
                <img
                  src="/homepage/assets/img/J2.svg"
                  alt="Jalem's Portfolio Logo"
                />
              </a>
            </div>

            <div class="col-auto">
              <ul class="navbar-nav flex-row align-items-center gap-1">
                <li class="nav-item">
                  <a
                    href="/index.html"
                    class="nav-link d-flex align-items-center justify-content-center gap-2"
                    title="Home"
                  >
                    <i class="bi bi-house-door"></i>
                    <span>Home</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a
                    href="/index.html#contact"
                    class="nav-link d-flex align-items-center justify-content-center gap-2"
                    title="Contact"
                  >
                    <i class="bi bi-envelope"></i>
                    <span>Contact</span>
                  </a>
                </li>

                <li class="nav-item">
                  <button
                    type="button"
                    class="theme-button d-flex align-items-center justify-content-center"
                    id="themeButton"
                    title="Toggle dark mode"
                    aria-label="Toggle dark mode"
                  >
                    <i id="themeIcon" class="bi bi-moon-fill"></i>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>

      <main class="error-content">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
              <div class="error-label">error / 404</div>

              <h1 class="error-title">404</h1>

              <h2 class="error-message">Oops! Page Not Found</h2>

              <p class="error-description">
                The page you are looking for might have been removed, had its
                name changed, or is temporarily unavailable.
              </p>

              <div class="mt-4">
                <a
                  href="index.html"
                  class="home-button"
                >
                  <i class="bi bi-house-door"></i>
                  Home
                </a>
              </div>

              <div class="error-info">
                <i class="bi bi-info-circle"></i>
                You can return to the homepage and continue exploring Jalem's
                portfolio.
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="error-footer">
        <div class="container">
          © 2026 Jalem Louise Grapani. All Rights Reserved.
        </div>
      </footer>
    </div>

    <script>
      const html = document.documentElement;
      const themeButton = document.getElementById("themeButton");
      const themeIcon = document.getElementById("themeIcon");

      const savedTheme = localStorage.getItem("portfolio-theme");

      if (savedTheme === "dark") {
        html.setAttribute("data-theme", "dark");
        themeIcon.className = "bi bi-sun-fill";
      } else {
        html.setAttribute("data-theme", "light");
        themeIcon.className = "bi bi-moon-fill";
      }

      themeButton.addEventListener("click", function () {
        const isDark = html.getAttribute("data-theme") === "dark";

        if (isDark) {
          html.setAttribute("data-theme", "light");
          localStorage.setItem("portfolio-theme", "light");
          themeIcon.className = "bi bi-moon-fill";
        } else {
          html.setAttribute("data-theme", "dark");
          localStorage.setItem("portfolio-theme", "dark");
          themeIcon.className = "bi bi-sun-fill";
        }
      });
    </script>
  </body>
</html>
