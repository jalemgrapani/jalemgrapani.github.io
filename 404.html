<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Jalem Louise Grapani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/img/J2.1.svg" />
    <base href="/" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Navigation */

      .site-sidebar {
        grid-template-columns: 1fr auto 1fr;
      }

      .sidebar-logo {
        justify-self: start;
      }

      .sidebar-bottom {
        justify-self: end;
      }

      /* Content */

      .error-page {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .error-main {
        padding-top: 90px;
      }

      .error-code {
        margin-bottom: 8px;
        color: var(--accent);
        font-family: var(--font-heading);
        font-size: clamp(5.5rem, 3rem + 14vw, 11rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .error-heading {
        margin-bottom: 14px;
        font-size: var(--fs-hero);
        line-height: 1.1;
      }

      .error-description,
      .information-box {
        max-width: 560px;
      }

      .error-description {
        font-size: var(--fs-lg);
      }

      .information-box {
        font-size: var(--fs-sm);
      }

      .information-box i {
        margin-right: 6px;
      }

      /* Components */

      .action-btn-primary {
        --bs-btn-color: var(--bg);
        --bs-btn-bg: var(--accent);
        --bs-btn-border-color: var(--accent);
        --bs-btn-hover-color: var(--accent);
        --bs-btn-hover-bg: var(--accent-soft);
        --bs-btn-hover-border-color: var(--accent);
        --bs-btn-active-color: var(--accent);
        --bs-btn-active-bg: var(--accent-soft);
        --bs-btn-active-border-color: var(--accent);
      }

      /* Responsive */

      @media (max-width: 575.98px) {
        .error-main {
          padding-top: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="container-fluid error-page d-flex flex-column">
      <!-- Navigation -->
      <div class="row">
        <div class="col-12">
          <div
            class="site-sidebar position-fixed z-3 d-grid align-items-center border rounded-pill shadow"
          >
            <a
              href="index.html"
              class="sidebar-logo d-flex align-items-center"
              aria-label="Back to homepage"
            >
              <img
                class="d-block"
                src="assets/img/J2.svg"
                alt="Jalem Louise Grapani logo"
                height="40"
              />
            </a>

            <nav
              class="site-navigation d-flex align-items-center"
              aria-label="Main navigation"
            >
              <a href="index.html" aria-label="Home"
                ><i class="bi bi-house-door"></i><span>Home</span></a
              >
              <a href="index.html#contact" aria-label="Contact"
                ><i class="bi bi-envelope"></i><span>Contact</span></a
              >
            </nav>

            <div class="sidebar-bottom d-flex align-items-center">
              <button
                type="button"
                class="theme-button d-flex align-items-center justify-content-center p-0 border bg-transparent text-reset rounded-circle"
                id="themeButton"
                aria-label="Switch to dark mode"
              >
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="row error-main align-items-center flex-grow-1">
        <div class="col-12 site-container mx-auto px-4 text-center">
          <div class="section-label font-monospace text-accent mb-3">
            error / 404
          </div>
          <div class="error-code" aria-hidden="true">404</div>
          <h1 class="error-heading">Page not found</h1>
          <p class="error-description text-body-secondary mx-auto">
            The page you're looking for does not exist. It may have been removed
            or renamed, or it may be temporarily unavailable.
          </p>
          <a
            href="index.html"
            class="action-btn-primary btn px-4 my-4 rounded-pill"
            >Back to home</a
          >
          <div class="information-box text-body-secondary mx-auto p-3 mb-4">
            <i class="bi bi-info-circle text-accent"></i>
            You can return to the homepage and continue exploring my portfolio.
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="row">
        <footer class="col-12 site-footer text-center">
          © <span id="year">2026</span> Jalem Louise Grapani · Calamba City, PH
        </footer>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      // Variables
      var html = document.documentElement;
      var themeButton = document.getElementById("themeButton");
      var themeIcon = document.getElementById("themeIcon");
      var year = document.getElementById("year");
      var theme = "light";

      // Functions
      function updateThemeButton() {
        if (html.getAttribute("data-theme") === "dark") {
          themeIcon.className = "bi bi-sun-fill";
          themeButton.setAttribute("aria-label", "Switch to light mode");
        } else {
          themeIcon.className = "bi bi-moon-stars-fill";
          themeButton.setAttribute("aria-label", "Switch to dark mode");
        }
      }

      function toggleTheme() {
        var nextTheme = "dark";

        if (html.getAttribute("data-theme") === "dark") {
          nextTheme = "light";
        }

        html.setAttribute("data-theme", nextTheme);

        try {
          localStorage.setItem("portfolio-theme", nextTheme);
        } catch (e) {}

        updateThemeButton();
      }

      // Theme
      try {
        if (localStorage.getItem("portfolio-theme") === "dark") {
          theme = "dark";
        }
      } catch (e) {}

      html.setAttribute("data-theme", theme);
      updateThemeButton();

      // Events
      themeButton.addEventListener("click", toggleTheme);

      // Footer
      year.textContent = new Date().getFullYear();
    </script>
  </body>
</html>
