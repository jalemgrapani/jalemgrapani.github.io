<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Jalem Louise Grapani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="homepage/assets/img/J2.1.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="homepage/assets/css/style.css" />

    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("portfolio-theme") === "dark" ? "dark" : "light",
        );
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>

    <style>
      .error-main {
        min-height: 100vh;
        display: flex;
        align-items: center;
      }

      .error-main .site-container {
        width: 100%;
        text-align: center;
      }

      .error-main .main-buttons {
        justify-content: center;
      }

      .error-code {
        margin-bottom: 8px;
        color: var(--accent);
        font-family: var(--font-heading);
        font-size: clamp(5.5rem, 3rem + 14vw, 11rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .error-heading {
        margin-bottom: 14px;
        font-size: var(--fs-hero);
        line-height: 1.1;
      }

      .error-description {
        max-width: 560px;
        margin: 0 auto;
        color: var(--muted);
        font-size: var(--fs-lg);
      }

      .error-main .information-box {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
        color: var(--muted);
        font-size: var(--fs-sm);
      }

      .error-main .information-box i {
        margin-right: 6px;
        color: var(--accent);
      }

      @media (max-width: 991.98px) {
        .error-main {
          min-height: auto;
          padding-bottom: 150px;
        }

        .site-navigation {
          justify-content: center;
          padding-left: 49px;
        }
      }

      @media (max-width: 575.98px) {
        .site-navigation {
          padding-left: 47px;
        }
      }
    </style>
  </head>

  <body>
    <aside class="site-sidebar">
      <a href="index.html" class="sidebar-logo" aria-label="Back to homepage">
        <img src="homepage/assets/img/J2.svg" alt="Jalem Louise Grapani logo" />
      </a>

      <nav class="site-navigation" aria-label="Main navigation">
        <a href="index.html"
          ><i class="bi bi-house-door"></i><span>Home</span></a
        >
        <a href="index.html#contact"
          ><i class="bi bi-envelope"></i><span>Contact</span></a
        >
      </nav>

      <div class="sidebar-bottom">
        <button
          type="button"
          class="theme-button"
          id="themeButton"
          aria-label="Switch to dark mode"
        >
          <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </aside>

    <main class="site-main error-main">
      <div class="container site-container">
        <div class="section-label">error / 404</div>
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-heading">Page not found</h1>
        <p class="error-description">
          The page you're looking for might have been removed, had its name
          changed, or is temporarily unavailable.
        </p>

        <div class="main-buttons">
          <a href="index.html" class="action-btn action-btn-primary"
            >Back to home</a
          >
        </div>

        <div class="information-box">
          <i class="bi bi-info-circle"></i>
          You can return to the homepage and continue exploring my portfolio.
        </div>

        <div class="site-footer">
          © 2026 Jalem Louise Grapani · Calamba City, PH
        </div>
      </div>
    </main>

    <script>
      const html = document.documentElement;
      const themeButton = document.getElementById("themeButton");
      const themeIcon = document.getElementById("themeIcon");

      function updateThemeButton() {
        const isDark = html.getAttribute("data-theme") === "dark";
        themeIcon.className = isDark
          ? "bi bi-sun-fill"
          : "bi bi-moon-stars-fill";
        themeButton.setAttribute(
          "aria-label",
          isDark ? "Switch to light mode" : "Switch to dark mode",
        );
      }

      themeButton.addEventListener("click", function () {
        const next =
          html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        try {
          localStorage.setItem("portfolio-theme", next);
        } catch (e) {}
        updateThemeButton();
      });

      updateThemeButton();
    </script>
  </body>
</html>
