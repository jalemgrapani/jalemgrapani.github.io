<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="../../homepage/assets/img/JL Logo.svg"
    />
    <title>Tommy Hilfiger</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container-fluid">
        <a
          class="d-flex align-items-center text-decoration-none ms-3"
          href="index.html"
        >
          <img
            src="assets/img/JW1.svg"
            alt="Logo"
            style="height: 44px; width: 44px"
            class="me-2"
          />
          <span class="brand-wordmark">The Watch Store<span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto mx-3">
            <a class="fs-6 nav-link active" href="index.html">Home</a>
            <a class="fs-6 nav-link" href="shared/outlet.html">Outlet</a>
            <a class="fs-6 nav-link" href="shared/about.html">About Us</a>
            <a class="fs-6 nav-link" href="shared/stores.html">Our Stores</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row g-4 bento-row align-items-start">
        <!-- Column 1 -->
        <div class="col-12 col-lg-3 d-flex flex-column gap-4">
          <div class="b-card b-card--paper hero-card">
            <img
              src="assets/img/watch1.1.png"
              alt="Tommy Hilfiger watch, front view"
            />
          </div>
          <div class="b-card b-card--graphite tagline-card">
            <div class="eyebrow-rule"></div>
            <p class="tagline">
              Where style<br />meets <strong>precision.</strong>
            </p>
          </div>
        </div>

        <!-- Column 2 -->
        <div class="col-12 col-lg-6 d-flex flex-column gap-4">
          <div class="b-card b-card--paper showcase-card">
            <img
              src="assets/img/gif.gif"
              alt="Watch detail animation"
              class="showcase-gif"
            />
            <img
              src="assets/img/watch2.1.png"
              alt="Featured Tommy Hilfiger watch"
              class="showcase-watch"
            />
            <a href="shared/preview.html"
              ><button class="accent-button">View details</button></a
            >
          </div>
          <div class="b-card b-card--paper duo-card">
            <img
              src="assets/img/watch.png"
              alt="Tommy Hilfiger watch, angle one"
            />
            <span class="divider"></span>
            <img
              src="assets/img/watchhh.png"
              alt="Tommy Hilfiger watch, angle two"
            />
          </div>
        </div>

        <!-- Column 3 -->
        <div class="col-12 col-lg-3 d-flex flex-column gap-4">
          <div class="b-card b-card--paper single-card">
            <img
              src="assets/img/watch.png"
              alt="Tommy Hilfiger watch on white"
            />
          </div>
          <div class="b-card b-card--paper photo-card">
            <img
              src="assets/img/watch4.1.jpg"
              alt="Tommy Hilfiger watch, lifestyle shot"
            />
          </div>
          <div class="b-card b-card--paper single-card" style="height: 220px">
            <img
              src="assets/img/watch3.1.png"
              alt="Tommy Hilfiger watch, top view"
            />
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
