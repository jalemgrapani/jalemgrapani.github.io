<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="../../../homepage/assets/img/JL Logo.svg"
    />
    <title>Outlet | Watch Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/outlet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container-fluid">
        <a
          class="d-flex align-items-center text-decoration-none ms-3"
          href="../index.html"
        >
          <img
            src="../assets/img/JW1.svg"
            alt="Logo"
            style="height: 44px; width: 44px"
            class="me-2"
          />
          <span class="brand-wordmark">The Watch Store</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto mx-3">
            <a class="fs-6 nav-link" href="../index.html">Home</a>
            <a class="fs-6 nav-link active" href="outlet.html">Outlet</a>
            <a class="fs-6 nav-link" href="about.html">About Us</a>
            <a class="fs-6 nav-link" href="stores.html">Our Stores</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Header -->
    <section class="outlet-header">
      <div class="container">
        <div class="row">
          <div class="col-12 col-lg-7">
            <h1 class="title mb-2">Outlet</h1>
            <p class="section-lede mb-0">
              Selected watches at reduced prices while stocks last.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filter-section">
      <div class="container">
        <div class="row align-items-center g-3">
          <div class="col-12 col-md-8">
            <div class="filter-row">
              <button class="filter-button active" data-filter="all">All</button>
              <button class="filter-button" data-filter="under">Under ₱10,000</button>
              <button class="filter-button" data-filter="over">₱10,000 and up</button>
            </div>
          </div>
          <div class="col-12 col-md-4 text-md-end">
            <span class="result-count" id="resultCount"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- Products -->
    <section class="products-section">
      <div class="container">
        <div class="row g-4" id="outletCardContainer"></div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/outlet.js"></script>
  </body>
</html>
