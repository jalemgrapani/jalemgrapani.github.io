<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.CO Philippines | POS</title>
  <link rel="icon" type="image/png" href="../../A03/assets/img/JCO LOGO.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../../A03/assets/css/style.css">
</head>

<body>
  <div class="container-fluid pos">

    <div class="row pos-header">
      <div class="col-auto">
        <img src="../../A03/assets/img/JCO LOGO.png" class="brand-logo" alt="J.CO logo">
      </div>
      <div class="col">
        <h1 class="title">J.CO Donuts & Coffee</h1>
      </div>
    </div>

    <div class="row pos-body">

      <div class="col menu">
        <div class="categories" id="categories" aria-label="Product categories"></div>
        <div class="product-grid" id="maincontainer" aria-label="Products"></div>
      </div>

      <div class="col-auto receipt-col">
        <div class="receipt-panel" aria-label="Current order">
          <div class="receipt-head">
            <h2 class="receipt-title">Current order</h2>
            <span class="receipt-count" id="itemCount">0 items</span>
          </div>

          <div class="receipt-list" id="receipt"></div>

          <div class="receipt-foot">
            <div class="total-row">
              <span>Total</span>
              <strong id="totalValue">₱0</strong>
            </div>
            <button type="button" class="pos-btn pos-btn-primary w-100" id="confirmBtn" onclick="confirmPurchase()"
              disabled>Confirm purchase</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="purchaseModal" tabindex="-1" aria-labelledby="purchaseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body">
          <div class="purchase-icon is-success" id="purchaseIcon"><i class="fa-solid fa-circle-check"></i></div>
          <h2 class="purchase-heading" id="purchaseModalLabel"></h2>
          <p class="purchase-message" id="purchaseMessage"></p>
          <button type="button" class="pos-btn pos-btn-primary w-100" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous">
    </script>
</body>

</html>
