<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J.CO Philippines | POS</title>
    <link
      rel="icon"
      type="image/png"
      href="../../A03/assets/img/JCO%20LOGO.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../../A03/assets/css/style.css" />
  </head>

  <body>
    <div class="container-fluid pos d-flex flex-column">
      <!-- Header -->
      <div class="pos-header d-flex align-items-center flex-shrink-0">
        <img
          src="../../A03/assets/img/JCO%20LOGO.png"
          height="48"
          alt="J.CO logo"
        />
        <h1 class="title">J.CO Donuts &amp; Coffee</h1>
      </div>

      <div class="row pos-body flex-grow-1">
        <!-- Menu -->
        <div class="col menu d-flex flex-column">
          <div
            class="categories d-flex flex-shrink-0 gap-2 overflow-x-auto"
            id="categories"
            aria-label="Product categories"
          ></div>
          <div
            class="product-grid"
            id="maincontainer"
            aria-label="Products"
          ></div>
        </div>

        <!-- Receipt -->
        <div class="col-auto receipt-col d-flex flex-column">
          <div
            class="receipt-panel d-flex flex-column flex-grow-1 overflow-hidden"
            aria-label="Current order"
          >
            <div
              class="receipt-head d-flex align-items-baseline justify-content-between flex-shrink-0"
            >
              <h2 class="receipt-title">Current order</h2>
              <span class="receipt-count" id="itemCount">0 items</span>
            </div>

            <div
              class="receipt-list flex-grow-1 overflow-y-auto"
              id="receipt"
            ></div>

            <div class="receipt-foot flex-shrink-0">
              <div
                class="total-row d-flex align-items-baseline justify-content-between"
              >
                <span>Total</span>
                <strong id="totalValue">₱0</strong>
              </div>
              <button
                type="button"
                class="pos-btn w-100"
                id="confirmBtn"
                onclick="confirmPurchase()"
                disabled
              >
                Confirm purchase
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="purchaseModal"
      tabindex="-1"
      aria-labelledby="purchaseModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0">
          <div class="modal-body text-center">
            <div class="purchase-icon is-success" id="purchaseIcon">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="purchase-heading mb-1" id="purchaseModalLabel"></h2>
            <p class="purchase-message" id="purchaseMessage"></p>
            <button
              type="button"
              class="pos-btn w-100"
              data-bs-dismiss="modal"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
