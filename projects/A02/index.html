<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../../homepage/assets/img/JL%20Logo.svg" />
    <title>Tommy Hilfiger 1710690 | Tommy Hilfiger</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="container-fluid d-flex flex-column h-100 p-0">
      <!-- Navigation -->
      <div class="row g-0 flex-shrink-0">
        <nav class="col-12 navbar navbar-expand-lg border-bottom">
          <div class="container-fluid">
            <a class="d-flex align-items-center ms-2 ms-lg-3" href="index.html">
              <img src="assets/img/JW1.svg" alt="Site logo" class="brand-logo" />
            </a>
            <button
              class="navbar-toggler border-0 shadow-none"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav align-items-end ms-auto me-3">
                <a class="nav-link active" href="index.html">Home</a>
                <a class="nav-link" href="shared/outlet.html">Outlet</a>
                <a class="nav-link" href="shared/about.html">About Us</a>
                <a class="nav-link" href="shared/stores.html">Our Stores</a>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <!-- Content -->
      <div class="row flex-nowrap bento-row">
        <!-- Left -->
        <div class="col-12 bento-col col-side">
          <div class="b-card hero-card">
            <img src="assets/img/watch1.1.png" alt="Tommy Hilfiger 1710690, front view" />
          </div>
          <div class="b-card tagline-card">
            <p class="tagline">All black.<br /><strong>All day.</strong></p>
          </div>
        </div>

        <!-- Center -->
        <div class="col-12 bento-col col-main">
          <div class="b-card showcase-card">
            <img src="assets/img/gif.gif" alt="Tommy Hilfiger 1710690 detail animation" class="showcase-gif" />
            <img src="assets/img/watch2.1.png" alt="Tommy Hilfiger 1710690 watch" class="showcase-watch" />
            <a href="shared/preview.html" class="details-link">
              <span>View details</span>
              <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
            </a>
          </div>
          <div class="b-card duo-card">
            <img src="assets/img/watch.png" alt="Tommy Hilfiger 1710690, angle one" />
            <span class="divider"></span>
            <img src="assets/img/watchhh.png" alt="Tommy Hilfiger 1710690, angle two" />
          </div>
        </div>

        <!-- Right -->
        <div class="col-12 bento-col col-small">
          <div class="small-pair">
            <div class="b-card">
              <img src="assets/img/watch.png" alt="Tommy Hilfiger 1710690, angle one" />
            </div>
            <div class="b-card photo-card p-0">
              <img src="assets/img/watch4.1.jpg" alt="Tommy Hilfiger 1710690 lifestyle shot" />
            </div>
          </div>
          <div class="b-card">
            <img src="assets/img/watch3.1.png" alt="Tommy Hilfiger 1710690, top view" />
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
